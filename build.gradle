plugins {
    id 'fabric-loom' version '1.7.2'   // или 1.8.0, если доступно
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://repo1.maven.org/maven2/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url = "https://maven.terraformersmc.com/" }

    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly files('libs/ShoulderSurfing-Fabric-1.20.1-5.0.11.jar')

    modImplementation name: 'cardinal-components-base-5.2.2'
    modImplementation name: 'cardinal-components-entity-5.2.2'
    include name: 'cardinal-components-base-5.2.2'
    include name: 'cardinal-components-entity-5.2.2'
// Интеграция NanoVG
    def lwjgl_version = "3.3.1"
    implementation "org.lwjgl:lwjgl-nanovg:${lwjgl_version}"
    include "org.lwjgl:lwjgl-nanovg:${lwjgl_version}"

    ["natives-windows", "natives-linux", "natives-macos", "natives-macos-arm64"].each {
        runtimeOnly "org.lwjgl:lwjgl-nanovg:${lwjgl_version}:${it}"
        include "org.lwjgl:lwjgl-nanovg:${lwjgl_version}:${it}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            ideConfigGenerated(true)
            runDir("run/server")
        }
    }
}